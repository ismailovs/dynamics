<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UZEX Clock</title><style>
:root{font-family:Arial,Helvetica,sans-serif;color-scheme:dark}body{min-height:100vh;margin:0;display:grid;place-items:center;background:#1f2a3a;color:white}.card{width:min(760px,calc(100% - 40px));padding:38px;text-align:center}h1{margin:0 0 28px;font-size:clamp(25px,4vw,40px)}#clock{font-size:clamp(50px,11vw,100px);font-weight:700;letter-spacing:2px;font-variant-numeric:tabular-nums}#date{margin-top:14px;font-size:clamp(18px,3vw,27px)}#status{margin-top:28px;color:#b7c8df;line-height:1.6;overflow-wrap:anywhere}.ok{color:#8ee7aa!important}.error{color:#ffb0b0!important}button{margin-top:22px;padding:12px 22px;border:0;border-radius:11px;cursor:pointer;font-weight:700;font-size:15px}
</style></head><body><main class="card"><h1>UZEX Server-Synchronized Time</h1><div id="clock">--:--:--.---</div><div id="date">Connecting…</div><div id="status"></div><button id="syncButton">Synchronize Now</button></main><script>
let baseServerEpoch=null,basePerformance=null,syncing=false;const clockEl=document.getElementById('clock'),dateEl=document.getElementById('date'),statusEl=document.getElementById('status'),buttonEl=document.getElementById('syncButton');
function render(){if(baseServerEpoch!==null){const now=new Date(baseServerEpoch+performance.now()-basePerformance);clockEl.textContent=new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Tashkent',hour:'2-digit',minute:'2-digit',second:'2-digit',fractionalSecondDigits:3,hour12:false}).format(now);dateEl.textContent=new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Tashkent',weekday:'long',year:'numeric',month:'long',day:'2-digit'}).format(now)}requestAnimationFrame(render)}
async function synchronize(){if(syncing)return;syncing=true;buttonEl.disabled=true;statusEl.className='';statusEl.textContent='Synchronizing with uzex.uz…';try{const start=performance.now();const response=await fetch('/api/time?ts='+Date.now(),{cache:'no-store'});const data=await response.json();const end=performance.now();if(!response.ok||!data.epoch_ms)throw new Error(data.error||'Unable to read UZEX server time.');baseServerEpoch=data.epoch_ms+(end-start)/2;basePerformance=end;statusEl.className='ok';statusEl.innerHTML='Synchronized with <strong>'+data.source+'</strong><br>Method: '+data.method+' · UZEX round trip: '+data.round_trip_ms+' ms'}catch(error){statusEl.className='error';statusEl.textContent='UZEX connection failed. Check internet/firewall, then press Synchronize Now. Details: '+error.message}finally{syncing=false;buttonEl.disabled=false}}
buttonEl.addEventListener('click',synchronize);synchronize();setInterval(synchronize,30000);requestAnimationFrame(render);
</script></body></html>
